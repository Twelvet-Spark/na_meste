<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Мониторинг{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Перейти к содержимому</a>
  <header class="topbar">
    <a class="mobile-brand" href="/">На месте</a>
    <button id="nav-toggle" type="button" class="btn nav-toggle" aria-expanded="false" aria-controls="app-nav">Меню</button>
    <nav id="app-nav" class="nav" aria-label="Основная навигация">
      <a class="app-brand" href="/">На месте</a>
      <a href="/" class="nav-link {{ 'active' if active_page == 'cameras' else '' }}"{% if active_page == 'cameras' %} aria-current="page"{% endif %}>Камеры</a>
      <a href="/employees" class="nav-link {{ 'active' if active_page == 'employees' else '' }}"{% if active_page == 'employees' %} aria-current="page"{% endif %}>Сотрудники</a>
      <a href="/presence" class="nav-link {{ 'active' if active_page == 'presence' else '' }}"{% if active_page == 'presence' %} aria-current="page"{% endif %}>Рабочее время</a>
      <a href="/recordings" class="nav-link {{ 'active' if active_page == 'recordings' else '' }}"{% if active_page == 'recordings' %} aria-current="page"{% endif %}>Записи</a>
      <a href="/settings" class="nav-link {{ 'active' if active_page == 'settings' else '' }}"{% if active_page == 'settings' %} aria-current="page"{% endif %}>Настройки</a>
      <a href="/debug" class="nav-link {{ 'active' if active_page == 'debug' else '' }}"{% if active_page == 'debug' %} aria-current="page"{% endif %}>Диагностика</a>
      <div class="nav-secondary">
        <a href="/global" class="nav-link {{ 'active' if active_page == 'global' else '' }}"{% if active_page == 'global' %} aria-current="page"{% endif %}>Архив наблюдений</a>
      </div>
    </nav>
    <div class="topbar-right">
      {% block topbar_right %}{% endblock %}
    </div>
  </header>
  <div id="main-content" class="app-content" tabindex="-1">
    {% block content %}{% endblock %}
  </div>
  <script src="/static/js/ui.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
